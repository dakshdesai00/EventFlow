spring.application.name=control-plane

spring.datasource.url=jdbc:postgresql://localhost:5432/eventflow
spring.datasource.username=eventflow
spring.datasource.password=eventflow

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.devtools.restart.enabled=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

minio.url=http://localhost:9000
minio.access-key=eventflow
minio.secret-key=eventflow123
minio.bucket=functions
services:
  postgres:
    image: postgres:17
    container_name: eventflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: eventflow-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: eventflow-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: eventflow
      MINIO_ROOT_PASSWORD: eventflow123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

  kafka:
    image: apache/kafka:latest
    container_name: eventflow-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  function-runner:
    build:
      context: ./services/worker
      dockerfile: Dockerfile

    env_file:
      - ./services/worker/.env

    depends_on:
      - kafka
      - postgres
      - minio

    command: node consumer.js

  retry-runner:
    build:
      context: ./services/worker
      dockerfile: Dockerfile

    env_file:
      - ./services/worker/.env

    depends_on:
      - kafka
      - postgres
      - minio

    command: node retryConsumer.js

volumes:
  postgres_data:
  minio_data:
